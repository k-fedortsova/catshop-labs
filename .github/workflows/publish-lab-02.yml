name: publish-lab-02

on:
  push:
    branches:
      - lab-02
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            lab-02/requirements.txt
            lab-02/requirements-dev.txt

      - name: Install dependencies
        working-directory: lab-02
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: lab-02
        run: python -m pytest -v


  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./lab-02
          push: false
          tags: catshop-lab-02:test
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}


  publish:
    name: Publish image to GHCR
    needs:
      - test
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/lab-02'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/catshop-lab-02" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image-build
        uses: docker/build-push-action@v6
        with:
          context: ./lab-02
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Save immutable image reference
        run: |
          mkdir -p lab-02
          echo "${{ steps.image.outputs.name }}@${{ steps.image-build.outputs.digest }}" > lab-02/published.txt
          cat lab-02/published.txt

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: lab-02-image-digest
          path: lab-02/published.txt
          if-no-files-found: error
          retention-days: 30
