services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://catshop:${POSTGRES_PASSWORD}@db:5432/catshop"
      PARTNER_URL: "http://partner:8080"
      PARTNER_TIMEOUT: "2"
    depends_on:
      db:
        condition: service_healthy
      partner:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catshop
      POSTGRES_USER: catshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catshop -d catshop"]
      interval: 5s
      timeout: 3s
      retries: 10

  partner:
    image: wiremock/wiremock:3.6.0
    ports:
      - "8081:8080"
    volumes:
      - ./partner/mappings:/home/wiremock/mappings:ro

volumes:
  postgres_data:
